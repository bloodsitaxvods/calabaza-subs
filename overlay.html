  const FX = (function() {
  const DPR = 3;

    for (let i = 0; i < 30; i++) addSpark(true);

  }

  function addSpark(burst) {

      x = 100 + (Math.random() - 0.5) * 60;
      y = 90 + (Math.random() - 0.5) * 50;
    } else {

  }

    const k = Math.min(1, b.t / 0.25) * Math.max(0, 1 - Math.max(0, b.t - b.life + 0.8) / 0.8);

    ctx.translate(b.x + OX, b.y + OY);
    ctx.scale(b.size, b.size);
    ctx.shadowColor = S.bordeGlow || '#ff7a1a';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#140a14';
    const wy = -6 * flap;
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.quadraticCurveTo(-6, wy - 4, -16, wy);
    ctx.quadraticCurveTo(-12, wy + 2, -11, wy + 5);
    ctx.quadraticCurveTo(-7, 1, -5, 4);
    ctx.quadraticCurveTo(-2, 2, 0, 5);
    ctx.quadraticCurveTo(2, 2, 5, 4);
    ctx.quadraticCurveTo(7, 1, 11, wy + 5);
    ctx.quadraticCurveTo(12, wy + 2, 16, wy);
    ctx.quadraticCurveTo(6, wy - 4, 0, -2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -1, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSpark(s) {
    const k = 1 - s.t / s.life;
    const r = s.size * (0.6 + 0.4 * k);
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    ctx.translate(s.x + OX, s.y + OY);
    ctx.rotate(s.t * 3);
    ctx.fillStyle = S.faceLiquidColor || '#ffd23f';
    ctx.shadowColor = S.bordeGlow || '#ff7a1a';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, -r * 2); ctx.lineTo(r * 0.5, -r * 0.5); ctx.lineTo(r * 2, 0); ctx.lineTo(r * 0.5, r * 0.5);
    ctx.lineTo(0, r * 2); ctx.lineTo(-r * 0.5, r * 0.5); ctx.lineTo(-r * 2, 0); ctx.lineTo(-r * 0.5, -r * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;

    for (const b of bats) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 20 * dt; }
    bats = bats.filter(b => b.t < b.life);

    if (sparkleOn) {
      sparkleTimer -= dt;
      if (sparkleTimer <= 0) { addSpark(false); sparkleTimer = 0.25 + Math.random() * 0.25; }
    }
    for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 40 * dt; }
    sparks = sparks.filter(s => s.t < s.life);

    ctx.clearRect(0, 0, CW, CH);
    for (const s of sparks) drawSpark(s);
    for (const b of bats) drawBat(b);

    if (bats.length || sparks.length || sparkleOn) {
      requestAnimationFrame(step);
    } else {
      running = false;
    }
  }

  function kick() {
    if (running || !ctx) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(step);
  }

  return { init, celebrate, setSparkles, clear };
})();

  // primer dibujo (con valores por defecto) antes de que llegue Firebase
  if (BAKED && BAKED.style) S = { ...DEFAULT_STYLE, ...BAKED.style };
  if (PREVIEW) { const st = $("pvStage"); if (st) st.appendChild(widgetEl); }
  renderWidget();

  /* ================================================================
     FIREBASE
  ================================================================ */
  let db = null, R = "";
  const rf = (p) => ref(db, R + p);
  let serverOffset = 0, offsetLoaded = false;
  const now = () => Date.now() + serverOffset;

  function startFirebase() {
    const app = initializeApp(CFG);
    db = getDatabase(app);
    R = "rooms/" + KEY + "/";
    onValue(ref(db, ".info/serverTimeOffset"), (s) => { serverOffset = num(s.val()); offsetLoaded = true; });

    onValue(rf("tally"), (snap) => {
      tally = snap.val() || {};
      const c = Math.max(0, Math.floor(num(tally.count)));
      const prev = count;
      count = c;
      if (!gotTally) { gotTally = true; maybeLoaded(); }
      else if (loaded && c > prev) bounce();
      updateProgress();
      hooks.count();
    });
    onValue(rf("goal"), (snap) => {
      const v = snap.val();
      goal = v == null ? 100 : Math.max(1, Math.floor(num(v, 100)));
      if (!gotGoal) { gotGoal = true; maybeLoaded(); }
      updateProgress();
      hooks.count();
    });
    if (!BAKED) {
      onValue(rf("style"), (snap) => {
        const v = snap.val();
        S = { ...DEFAULT_STYLE, ...(v || {}) };
        renderWidget();
        hooks.style();
      });
    }
    // pruebas de animación desde el panel (no tocan el conteo)
    let fxSeen = null;
    onValue(rf("fx"), (snap) => {
      const v = snap.val();
      if (!v || !v.id) return;
      if (fxSeen === null) { fxSeen = v.id; return; }        // lo que ya estaba al abrir no se repite
      if (v.id === fxSeen) return;
      fxSeen = v.id;
      if (v.type === "bounce") bounce();
      else if (v.type === "complete") FX.celebrate();
    });

    startPresence();
    ircConnect();
    setInterval(sweepBulks, SWEEP_MS);
  }
  function maybeLoaded() {
    if (loaded || !gotTally || !gotGoal) return;
    wasComplete = goal > 0 && count >= goal;   // al abrir no se festeja otra vez
    loaded = true;
  }

  /* ================================================================
     CONTEO: una sola transacción guarda el candado del evento y la suma.
     Así no hay forma de que el candado quede puesto sin sumar, ni de sumar dos veces.
     tally = { count, locks: { idEvento: hora }, bulks: { idRegalo: { n, got, cr, by, ts, done } } }
       n   = subs anunciadas en un regalo masivo
       got = avisos sueltos que llegaron de ese regalo
       cr  = cuántas de ese regalo ya se sumaron (siempre max(n, got))
  ================================================================ */
  let tally = {};
  const H48 = 48 * 3600 * 1000;

  // Aplica una lista de operaciones sobre el tally. Las que ya estaban contadas (candado puesto) se saltan.
  function makeTx(ops) {
    const outs = ops.map(() => ({ skip: true, delta: 0, before: 0, after: 0, bulk: null }));
    const fn = (cur) => {
      const t = now();
      const c = (cur && typeof cur === "object") ? cur : {};
      const locks = { ...(c.locks || {}) };
      const bulks = { ...(c.bulks || {}) };
      let cnt = Math.max(0, Math.floor(num(c.count)));
      let changed = false;
      const getBulk = (gid) => ({ n: 0, got: 0, cr: 0, ts: t, by: "", ...(bulks[gid] || {}) });
      ops.forEach((op, i) => {
        const out = outs[i];
        out.skip = true; out.delta = 0; out.bulk = null; out.before = cnt;
        if (op.lock && locks[op.lock] != null) return;          // ya lo contó otra copia
        switch (op.t) {
          case "one": cnt += 1; break;
          case "gift": {
            const b = getBulk(op.gid);
            b.got = num(b.got) + 1;
            if (!b.by) b.by = op.by || "";
            const target = Math.max(num(b.n), b.got);
            cnt += target - num(b.cr);
            b.cr = target; b.lt = t;
            bulks[op.gid] = b; out.bulk = b;
            break;
          }
          case "bulk": {
            const b = getBulk(op.gid);
            b.n = Math.max(num(b.n), op.n);
            b.by = op.by || b.by;
            if (op.anon) b.anon = true;
            const target = Math.max(b.n, num(b.got));
            cnt += target - num(b.cr);
            b.cr = target; b.lt = t;
            bulks[op.gid] = b; out.bulk = b;
            break;
          }
          case "add": cnt = Math.max(0, cnt + op.d); break;
          case "set": cnt = Math.max(0, op.v); break;
          case "done": {
            const b = bulks[op.gid];
            if (!b || b.done) return;
            bulks[op.gid] = { ...b, done: true };
            out.bulk = bulks[op.gid];
            break;
          }
          default: return;
        }
        if (op.lock) locks[op.lock] = t;
        out.skip = false; changed = true;
        out.after = cnt; out.delta = cnt - out.before;
      });
      if (!changed) return;                                      // nada que guardar
      for (const k in locks) if (t - num(locks[k]) > H48) delete locks[k];
      for (const k in bulks) if (bulks[k] && bulks[k].done && t - num(bulks[k].ts) > H48) delete bulks[k];
      return { ...c, count: cnt, locks, bulks, updated: t };
    };
    return { fn, outs };
  }

  // Cola: cada copia manda una transacción a la vez y junta en una sola las operaciones
  // que se acumulan (un regalo de 50 subs se guarda en 1 o 2 escrituras, no en 50).
  const opQueue = [];
  let opBusy = false;
  function runOp(op) {
    return new Promise((res) => { opQueue.push({ op, res }); pumpOps(); });
  }
  async function pumpOps() {
    if (opBusy || !opQueue.length || !db) return;
    opBusy = true;
    const batch = opQueue.splice(0, 200);
    const { fn, outs } = makeTx(batch.map((b) => b.op));
    let committed = false, ok = false;
    for (let i = 0; i < 6 && !ok; i++) {
      try {
        // applyLocally: false = la pantalla solo cambia con el valor confirmado por Firebase
        const res = await runTransaction(rf("tally"), fn, { applyLocally: false });
        committed = res.committed; ok = true;
      } catch (e) { await sleep(1000 * (i + 1)); }
    }
    batch.forEach((b, i) => b.res(committed && !outs[i].skip ? outs[i] : null));
    opBusy = false;
    pumpOps();
  }

  // Respaldo entre copias: la primera copia conectada (por orden de id) cuenta al instante;
  // las demás esperan un poco y solo cuentan si el evento todavía no aparece contado.
  const BACKUP_DELAY = (TEST && TEST.backupDelay) || 1500;
  function myRank() {
    const live = Object.entries(presence).filter(([id, p]) => p && p.irc).map(([id]) => id).sort();
    const i = live.indexOf(INSTANCE);
    return i < 0 ? live.length : i;
  }
  const alreadyCounted = (op) => !!(op.lock && tally && tally.locks && tally.locks[op.lock] != null);

  function addHistory(kind, text, delta, note) {
    if (!db) return;
    const e = { ts: now(), kind, text: String(text).slice(0, 280), by: whereLabel() };
    if (note) e.note = String(note).slice(0, 280);
    if (delta != null) e.delta = Math.round(delta);
    push(rf("history"), e).catch(() => {});
  }

  async function countEvent(op, text, kind, noteFn) {
    const wait = myRank() * BACKUP_DELAY;
    if (wait) { await sleep(wait); if (alreadyCounted(op)) return; }
    const r = await runOp(op);
    if (!r || r.delta <= 0) return;
    addHistory(kind, text, r.delta, noteFn ? noteFn(r) : "");
  }

  // Revisión de regalos masivos: compara lo anunciado con los avisos sueltos que llegaron
  let sweeping = false;
  async function sweepBulks() {
    if (sweeping || !tally || !tally.bulks || !offlineOk()) return;
    sweeping = true;
    try {
      for (const [gid, b] of Object.entries(tally.bulks)) {
        if (!b || b.done || now() - Math.max(num(b.ts), num(b.lt)) < BULK_WAIT) continue;   // espera a que dejen de llegar avisos
        const r = await runOp({ t: "done", gid });
        if (!r || !r.bulk) continue;
        const B = r.bulk, n = num(B.n), got = num(B.got), who = B.by || "alguien";
        if (n > 0 && got === 0) {
          addHistory("warn", `Regalo de ${who}: se anunciaron ${n} subs, pero no llegó ningún aviso suelto`, null,
            `Se contaron las ${n} del anuncio. Si el conteo subió de más con este regalo, resta la diferencia a mano.`);
        } else if (n > 0 && got < n) {
          addHistory("warn", `Regalo de ${who}: se anunciaron ${n} subs y llegaron ${got} avisos sueltos`, null,
            `Se contaron las ${n} del anuncio. Twitch no mandó ${n - got} ${n - got === 1 ? "aviso" : "avisos"}; no hace falta hacer nada.`);
        } else if (n > 0 && got > n) {
          addHistory("warn", `Regalo de ${who}: llegaron ${got} avisos sueltos y se anunciaron solo ${n}`, null,
            `Se contaron ${got}. Revisa si es correcto.`);
        }
      }
    } finally { sweeping = false; }
  }
  const offlineOk = () => offsetLoaded;

  /* ================================================================
     TWITCH CHAT (IRC anónimo, solo lectura)
  ================================================================ */
  function parseTags(raw) {
    const tags = {};
    if (!raw.startsWith("@")) return { tags, rest: raw };
    const sp = raw.indexOf(" ");
    for (const pair of raw.slice(1, sp).split(";")) {
      const eq = pair.indexOf("=");
      tags[pair.slice(0, eq)] = pair.slice(eq + 1);
    }
    return { tags, rest: raw.slice(sp + 1) };
  }
  const unesc = (s) => String(s || "").replace(/\\s/g, " ").replace(/\\:/g, ";").replace(/\\\\/g, "\\");
  const planLabel = (p) => ({ Prime: "Prime", "1000": "T1", "2000": "T2", "3000": "T3" }[String(p)] || "T1");
  const giftId = (tags) => {
    const g = tags["msg-param-origin-id"] || tags["msg-param-community-gift-id"] || "";
    return g ? "g" + safeKey(g) : "";
  };

  function handleLine(line, sock) {
    if (line.startsWith("PING")) { sock.send("PONG :tmi.twitch.tv"); return; }
    const { tags, rest } = parseTags(line);
    if (rest.startsWith("PING")) { sock.send("PONG :tmi.twitch.tv"); return; }
    const parts = rest.split(" ");
    const cmd = rest.startsWith(":") ? parts[1] : parts[0];
    if (cmd !== "USERNOTICE") return;
    // Chat compartido: lo que viene del canal de otro streamer no cuenta
    if (tags["source-room-id"] && tags["room-id"] && tags["source-room-id"] !== tags["room-id"]) return;

    const mid = tags["msg-id"] || "";
    const user = unesc(tags["display-name"]) || tags.login || "alguien";
    const evId = tags.id || `${mid}-${tags["user-id"] || ""}-${tags["tmi-sent-ts"] || ""}`;
    const lock = "e" + safeKey(evId);
    const plan = tags["msg-param-sub-plan"];
    const anon = mid.startsWith("anon") || String(tags.login || "").toLowerCase() === "ananonymousgifter";
    const gifter = anon ? "Anónimo" : user;
    const kind = anon ? "anon" : "auto";

    switch (mid) {
      case "sub":
      case "resub": {
        const multi = parseInt(tags["msg-param-multimonth-duration"], 10) || 1;
        const cum = parseInt(tags["msg-param-cumulative-months"], 10) || 0;
        const text = mid === "resub"
          ? `Resub ${planLabel(plan)} de ${user}${cum > 1 ? ` (mes ${cum})` : ""}`
          : `Sub ${planLabel(plan)} de ${user}`;
        countEvent({ t: "one", lock }, text, "auto", () => multi > 1 ? `Pagó ${multi} meses juntos; cuenta como 1 sub.` : "");
        return;
      }
      case "subgift":
      case "anonsubgift": {
        const to = unesc(tags["msg-param-recipient-display-name"]) || "";
        const gid = giftId(tags);
        const text = `Sub ${planLabel(plan)} regalado por ${gifter}${to ? " a " + to : ""}`;
        countEvent(gid ? { t: "gift", lock, gid, by: gifter } : { t: "one", lock }, text, kind);
        return;
      }
      case "submysterygift":
      case "anonsubmysterygift": {
        const n = parseInt(tags["msg-param-mass-gift-count"], 10) || 0;
        const gid = giftId(tags);
        if (n <= 0 || !gid) return;      // sin id no se puede enlazar: cuentan los avisos sueltos
        countEvent({ t: "bulk", lock, gid, n: Math.min(n, 1000), by: gifter, anon }, `Regalo de ${gifter}: ${n} subs ${planLabel(plan)}`, kind,
          (r) => r.delta < n ? `${n - r.delta} ya se habían contado por separado.` : "");
        return;
      }
      // sigue pagando un sub que le regalaron, o pasó de Prime a pagado: cuenta como sub
      case "giftpaidupgrade":
      case "anongiftpaidupgrade": {
        const from = unesc(tags["msg-param-sender-name"]) || "";
        countEvent({ t: "one", lock }, `Sub de ${user} (sigue pagando el sub que le regaló${from ? " " + from : "ron"})`, "auto");
        return;
      }
      case "primepaidupgrade":
        countEvent({ t: "one", lock }, `Sub ${planLabel(plan || "1000")} de ${user} (pasó de Prime a pagado)`, "auto");
        return;
      default: return;
    }
  }

  let ws = null, ircRetry = null, ircGen = 0, ircLive = false;
  let ircLastRx = 0, ircPinged = false;
  let ircDownAt = 0, othersLiveAtDown = true, everLive = false;
  setInterval(() => {
    if (!ws || ws.readyState !== 1) return;
    const idle = Date.now() - ircLastRx;
    if (idle > 75000) { try { ws.close(); } catch (e) {} ircConnect(); return; }
    if (idle > 40000 && !ircPinged) { ircPinged = true; try { ws.send("PING :bs-subs"); } catch (e) {} }
  }, 15000);

  function setIrc(live) {
    if (live && !ircLive) {
      // se recuperó: si estuvo caído un rato y ninguna otra copia escuchaba, se avisa
      if (everLive && ircDownAt) {
        const gap = Date.now() - ircDownAt;
        if (gap > 20000 && !othersLiveAtDown) {
          addHistory("warn", `El chat estuvo desconectado ${Math.round(gap / 1000)} s en ${whereLabel()} y ninguna otra copia escuchaba`, null,
            "Si alguien se suscribió en ese rato, súmalo a mano.");
        }
      }
      ircDownAt = 0; everLive = true;
    } else if (!live && ircLive) {
      ircDownAt = Date.now();
      othersLiveAtDown = Object.entries(presence).some(([id, p]) => id !== INSTANCE && p && p.irc);
    }
    ircLive = live;
    announce();
    hooks.irc(live);
  }
  function ircConnect() {
    const gen = ++ircGen;
    clearTimeout(ircRetry);
    if (ws) { try { ws.close(); } catch (e) {} }
    const sock = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ws = sock;
    sock.onopen = () => {
      ircLastRx = Date.now(); ircPinged = false;
      sock.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      sock.send("PASS SCHMOOPIIE");
      sock.send("NICK justinfan" + (1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 80000)));
      sock.send("JOIN #" + TW_CHANNEL);
    };
    sock.onmessage = (e) => {
      if (gen !== ircGen) return;
      ircLastRx = Date.now(); ircPinged = false;
      for (const line of String(e.data).split("\r\n")) {
        if (!line) continue;
        if (line.includes(" 001 ") || line.includes(" JOIN #" + TW_CHANNEL)) setIrc(true);
        try { handleLine(line, sock); } catch (err) {}
      }
    };
    sock.onclose = () => {
      if (gen !== ircGen) return;
      setIrc(false);
      ircRetry = setTimeout(ircConnect, 4000);
    };
    sock.onerror = () => { try { sock.close(); } catch (e) {} };
  }

  /* ---------------- presencia: quién está contando ---------------- */
  let presence = {};
  let presRef = null;
  function announce() {
    if (!presRef) return;
    set(presRef, { where: whereLabel(), irc: ircLive, ts: now() }).catch(() => {});
  }
  function startPresence() {
    presRef = rf("presence/" + INSTANCE);
    onValue(ref(db, ".info/connected"), (s) => {
      if (s.val() === true) { onDisconnect(presRef).remove(); announce(); }
    });
    onValue(rf("presence"), (snap) => { presence = snap.val() || {}; hooks.presence(); });
  }

  if (CONFIGURED && KEY) startFirebase();
  else if (DISPLAY) console.warn("Overlay sin configurar: falta la config de Firebase o la clave (?k=) en el link.");

  
</script>
